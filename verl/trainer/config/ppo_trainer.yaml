data:
  tokenizer: null
  use_shm: False
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  # When train dataset size is not divisible by train batch size, set false to keep the last partial batch (full AlfWorld train set).
  train_drop_last: true
  val_batch_size: null
  # If true, drop the last incomplete validation batch. Use when val env worker count (val_batch_size) must match
  # every batch (e.g. AlfWorld); you lose up to (val_batch_size - 1) episodes at most.
  val_drop_last: false
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  return_full_prompt: False
  shuffle: True
  filter_overlong_prompts: False # for large-scale dataset, filtering overlong prompts could be timeconsuming. You cat set the filter_overlong_prompts_workers to use multiprocessing to speed up.
  filter_overlong_prompts_workers: 1
  truncation: error
  image_key: images
  video_key: videos
  trust_remote_code: False  # main_ppo will check this config to determine whether to use remote code for tokenizer
  apply_chat_template_kwargs: {}
  custom_cls:
      path: null
      name: null

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    use_shm: False
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    enable_activation_offload: False
    use_remove_padding: False
    lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
    lora_alpha: 16  # LoRA scaling factor
    target_modules: all-linear  # all-linear or [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]
    use_liger: False
    use_fused_kernels: False
    trust_remote_code: False
  actor:
    # If false, RayPPOTrainer skips update_actor (rollout / generate_sequences unchanged).
    trainable: true
    strategy: fsdp  # [fsdp, fsdp2], This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
    ppo_micro_batch_size_per_gpu: null
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    # pg_losses2 = -advantages * torch.clamp(ratio, 1 - cliprange_low, 1 + cliprange_high)
    clip_ratio: 0.2 # default value if clip_ratio_low and clip_ratio_high are not specified
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0 # lower bound of the value for Dual-clip PPO from https://arxiv.org/pdf/1912.09729
    loss_agg_mode: "token-mean" # / "seq-mean-token-sum" / "seq-mean-token-mean"
    entropy_coeff: 0.001
    use_invalid_action_penalty: True
    invalid_action_penalty_coef: 0.1
    use_kl_loss: False # True for GRPO
    use_torch_compile: True # False to disable torch compile
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    policy_loss:
      loss_mode: "vanilla"
    checkpoint:
      contents: ['model', 'optimizer', 'extra']  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
    optim:
      lr: 1e-6
      lr_warmup_steps: -1 # Prioritized. Negative values mean delegating to lr_warmup_steps_ratio.
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: 0.0   # only used with cosine lr scheduler, default to 0.0
      num_cycles: 0.5     # only used with cosine lr scheduler, default to 0.5
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
      weight_decay: 0.01
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      optimizer_offload: False
      offload_policy: False # only for fsdp2, offload param\grad\optimizer during train
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      fsdp_size: -1
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: False
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    use_torch_compile: ${actor_rollout_ref.actor.use_torch_compile}
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  rollout:
    name: vllm
    mode: sync # sync: LLM, async: AsyncLLM
    chat_scheduler: null # async chat scheduler, e.g examples.ppo_trainer.naive_chat_scheduler.NaiveChatCompletionScheduler
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    use_fire_sampling: False # https://arxiv.org/abs/2410.21236
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor  # safetensors (for huge model, and set use_shm=True); dummy_dtensor: randomly init model weight
    layered_summon: False # for huge model, layered summon can save memory (prevent OOM) but make it slower
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    engine_kwargs: # inference engine parameters
      vllm:
        swap_space: null # null means "use the engine default value" (usually 4 GB), setting it to, e.g., 32 means 32 GB
      sglang:
        attention_backend: null # null means use the engine default value, available options: flashinfer, triton, flashmla
    val_kwargs:
      # sampling parameters for validation
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 1.0
      temperature: 0
      n: 1
      do_sample: False # default eager for validation
    # Closed-model / 外部 Chat API：rollout.name=openai_api，tensor_model_parallel_size=1；base_url/model/api 在训练脚本或环境中填写
    openai_api:
      base_url: ""
      api_key: ${oc.env:OPENAI_API_KEY,}
      model: ""
      max_concurrent: 8
      timeout_sec: 120
      max_retries: 2
      retry_backoff_sec: 1.0
      extra_headers: { }
      extra_body: { }   # Extra JSON fields merged into /v1/chat/completions payload.
      disable_thinking: null   # null -> auto disable for qwen3* models; true -> force add enable_thinking=false.
    multi_turn:
      enable: False  # set to True for multi-turn tool interaction tasks; should set rollout.name to sglang as well
      max_turns: null  # null for no limit (default max_length // 3)
      tool_config_path: null  # null for no tool
      format: chatml  # chatml, more formats will be supported in the future

critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: fsdp # [fsdp, fsdp2]
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
    weight_decay: 0.01
  model:
    path: ~/models/deepseek-llm-7b-chat
    use_shm: False
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    enable_activation_offload: False
    use_remove_padding: False
    trust_remote_code: ${actor_rollout_ref.model.trust_remote_code}
    fsdp_config:
      param_offload: False
      optimizer_offload: False
      offload_policy: False # only for fsdp2, offload param\grad\optimizer during train
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
    lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
    lora_alpha: 16  # LoRA scaling factor
    target_modules: all-linear  # all-linear or [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: null
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  loss_agg_mode: ${actor_rollout_ref.actor.loss_agg_mode}
  checkpoint:
    contents: ['model', 'optimizer', 'extra']  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    use_shm: False
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    use_fused_kernels: ${actor_rollout_ref.model.use_fused_kernels}
    trust_remote_code: False
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: False
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      fsdp_size: -1
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: null # set a number
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  reward_manager: episode
  launch_reward_fn_async: False # custom reward function executed async on CPU, during log_prob
  sandbox_fusion:
    url: null # faas url to run code in cloud sandbox
    max_concurrent: 64 # max concurrent requests to sandbox
  # Outcome (episode_rewards) + format reward on the last response token.
  # Non-Search: think + action + optional memory_retrieve. Search: think + exclusive search xor answer (+ optional memory).
  format_reward:
    enable: true
    weight_outcome: 1.0
    # Set > 0 to compute format and add ``weight_outcome * outcome + weight_format * format`` on the last response token.
    weight_format: 0.1
    # Upper bounds on **valid** (min_segment_chars) segments per response. 0 = no upper cap.
    # AlfWorld ``alfworld_projection`` / memory ``extract_query`` only consume the first block; extras are protocol drift.
    max_think_segments: 0
    max_action_segments: 1
    max_memory_retrieve_segments: 5
    search_data_source_substrings:
      - search
    min_segment_chars: 5
    require_memory_retrieve: false
    weight_think: 1.0
    weight_action: 1.0
    weight_memory: 1.0
    penalize_chinese_chars: true
    think_open_tag: "<think>"
    think_close_tag: "</think>"
    action_open_tag: "<action>"
    action_close_tag: "</action>"
    search_open_tag: "<search>"
    search_close_tag: "</search>"
    answer_open_tag: "<answer>"
    answer_close_tag: "</answer>"
    memory_open_tag: ${env.memory.retrieval_query_open_tag}
    memory_close_tag: ${env.memory.retrieval_query_close_tag}
    # Early training: relax format shaping using trainer global_step (see rollout ``meta_info.trainer_global_step``).
    # 0 = disabled. While step < format_warmup_global_steps: effective format weight is
    #   weight_format * warmup_weight_format_multiplier
    # and optional overrides below apply when set (non-null).
    format_warmup_global_steps: 0
    warmup_weight_format_multiplier: 0.0
    warmup_require_memory_retrieve: null
    warmup_penalize_chinese_chars: null
custom_reward_function:
  path: null
  name: compute_score

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: False
  pf_ppo:
    reweight_method: pow  # ["pow", "max_min", "max_random"]
    weight_pow: 2.0
  gigpo:
    step_advantage_w: 1.0
    mode: "mean_norm" # "mean_norm" or "mean_std_norm"
    enable_similarity: False # whether to use similarity-based anchor state grouping in GiGPO (supported for text-only tasks)
    similarity_thresh: 0.95 # similarity threshold for GiGPO (0.0, 1.0)
  filter_groups: # DAPO from https://arxiv.org/abs/2503.14476
    enable: False
    max_num_gen_batches: 10

trainer:
  balance_batch: True
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  log_val_generations: 0
  rollout_data_dir: null # directory for logging the rollout data, no dump if null
  # Validation JSONL: one object per trajectory; nested ``turns`` for each env step (see RayPPOTrainer._dump_validation_trajectories_jsonl).
  validation_data_dir: null
  # If > 0, append every N **new** trajectories (by first-seen order) to ``{global_steps}_live.jsonl`` during validation.
  # Full dump to ``{global_steps}.jsonl`` still runs once at the end. 0 = disabled.
  val_dump_every_n_trajs: 0
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_mode: auto # or disable or resume_path if resume_from_path is set
  resume_from_path: null
  # Fine-grained resume: e.g. only restore mem_adaptor/ while keeping Reasoning weights from HF init.
  resume_load_actor: true
  resume_load_mem_adaptor: true
  resume_load_critic: true
  val_before_train: True
  val_only: False
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: False
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  # The timeout for ray worker group to wait for the register center to be ready
  ray_wait_register_center_timeout: 300
  device: cuda

ray_init:
  num_cpus: null # `None` means using all CPUs, which might cause hang if limited in systems like SLURM. Please set to a number allowed then.
  # Ray Object Store (Plasma) cap in bytes. 68719476736 = 128 GiB. Lowers default huge RAM use on large machines.
  # object_store_memory: 137438953472 # 128G

env:
  env_name: alfworld/AlfredTWEnv
  seed: 42
  max_steps: 50
  history_length: 2
  memory:
    enabled: False   # Whether to enable the external memory module.
    retrieval_mode: fixed   # fixed: retrieve on every observation; agentic: let the model decide when to retrieve.
    # Optional: override ``retrieval_mode`` by trainer ``global_step`` (inclusive start, exclusive end).
    # First matching phase wins. If no phase matches, ``retrieval_mode`` above is used.
    # Example:
    # retrieval_mode_phases:
    #   - global_step_start: 0
    #     global_step_end: 200
    #     mode: fixed
    #   - global_step_start: 200
    #     global_step_end: null
    #     mode: agentic
    retrieval_mode_phases: null
    # When true, log trainer_global_step, resolved retrieval_mode, and a short retrieve query preview
    # on each MemoryManager.retrieve (can be noisy).
    debug_retrieval: false
    # Injected when a retrieval query runs but the vector store returns no hits (aligns with mem_adaptor.no_experience_message).
    empty_retrieval_message: "(No validated memory principle applies; rely on observation and reasoning.)"
    # Log memory.timing lines for retrieve rollups, summarization, VDB insert, utility updates, clear/prune.
    log_operation_timing: true
    backend: milvus   # Memory backend type. "milvus" for local VDB, "http" for remote/local service.
    auto_start_server: True   # Whether to auto-start a local HTTP memory service.
    mode: init_if_missing   # Initialization mode for the vector store.
    store_dir: null   # Local directory for the memory database files.
    collection_name: null   # Optional collection name; auto-generated when null.
    clean_before_init: False   # Whether to clean existing local db files before initialization.
    write_back: False   # Whether to write rollout trajectories back into memory online.
    only_store_positive_reward: False   # When write_back is enabled, only keep positive-reward samples.
    max_pairs_per_episode: 8   # When write_back is enabled, max number of memory pairs extracted from one episode.
    # Whole-trajectory summarization then VDB insert (requires write_back=true, mode=self|teacher).
    experience_summarizer:
      mode: none   # none | self (actor_rollout_wg.generate_sequences) | teacher (OpenAI-compatible HTTP)
      # full: JSON with state_text, action_text, memory_text, optional metadata (strong models / GPT-style offline extract).
      # compact: model outputs only memory_text (+ optional source_step); state/action filled from trajectory (weak self-distill).
      schema: full
      num_memories_per_trajectory: 1 # how many memories to extract from each trajectory
      summarization_batch_size: 0 # max trajectories per LLM batch (0 = submit all pending trajectories in one call).
      # After filtering (e.g. only_store_positive_reward), keep at most round(rollout.n * fraction) trajectories per GRPO group
      # for write-back summarization; prefer balanced success/failure, then fill from the larger pool (random). 1.0 = keep all.
      grpo_summarize_keep_fraction: 0.25
      parse_max_attempts: 3 # max model calls when JSON parse yields no memories or all items fail validation (state/action/memory_text).
      extractor_model_label: online_rollout # optional label stored in record metadata (teacher defaults to openai_api.model).
      system_prompt: "" # empty -> built-in JSON extraction system prompt
      trajectory_user_prompt_template: "" # empty -> built-in template (same schema as extract_memory_records.py)
      # Long-episode compress for write-back summarization (head+tail+protect <memory_retrieve>, then turn-level trim to token budget).
      summarizer_trajectory_structural_compress: True
      summarizer_trajectory_episode_max_turns: 50
      summarizer_trajectory_head_turns: 10
      summarizer_trajectory_tail_turns: 10
      summarizer_trajectory_min_turns_kept: 8
      summarizer_trajectory_token_trim: true
      summarizer_trajectory_include_coverage_note: true
      # Summarizer-only prompt token budget (trajectory trim + mode=self encoding). Null = use full vLLM cap
      # (max_model_len - response_length). Multi-turn still uses data.max_prompt_length.
      summarizer_max_prompt_tokens: null
      temperature: 0.6
      top_p: 1.0
      do_sample: True
      openai_api:
        base_url: https://api.openai.com/v1
        api_key: ${oc.env:OPENAI_API_KEY,}
        model: gpt-4o-mini
        max_tokens: 4096
        temperature: 0.6
        timeout_sec: 120.0
        max_concurrent: 8
        max_retries: 2
        retry_backoff_sec: 1.0
        extra_headers: {}
        response_format_json: true
    # EvolveR-style utility: Laplace score (c_succ+1)/(c_use+2) in metadata + optional prune/clear.
    experience_utility:
      enable: true
      update_on_retrieval: true   # Increment utility_use_count when a memory is retrieved and injected.
      update_on_episode_end: true # On trajectory success, increment utility_succ_count for memories seen in infos.
      prune_every_n_global_steps: 0   # 0 = disabled; e.g. 500 to prune low-score memories every N trainer steps.
      prune_score_threshold: 0.35    # Drop when Laplace utility below this (after min_uses_before_prune).
      min_uses_before_prune: 3       # Require at least this many retrievals before a row is eligible for pruning.
      clear_every_n_global_steps: 0  # 0 = disabled; if >0, drops and recreates empty collection every N steps (runs before prune).
    count_query_as_step: True   # Whether a parsed agentic memory query should also consume one episode step.
    vdb_base_url: null   # Base URL of the HTTP memory service when backend=http.
    server_bind_host: "0.0.0.0"   # Bind host for the local memory service.
    server_advertised_host: null   # Host advertised to workers; auto-detected when null.
    server_port: 0   # Port for the local memory service. Use 0 for a random free port.
    server_startup_timeout: 60   # Max seconds to wait for the memory service to become ready.
    rebuild_source_path: null   # Optional path to rebuild memory from an existing .jsonl/.db source.
    rebuild_source_collection_name: null   # Source collection name when rebuilding from a db file.
    embedding_api_url: null   # Optional embedding API endpoint. Use local sentence-transformers when null.
    embedding_api_key: "empty"   # API key for the embedding service.
    embedding_model: bge_m3   # Embedding model name.
    embedding_dim: 1024   # Embedding vector dimension.
    vdb_timeout: 30   # Request timeout in seconds for the memory backend.
    retrieve_key: memory_text  # memory_text | state_text
    # VDB retrieval width; MemAdaptor may use only the first mem_adaptor.retrieval_top_k hits from memory_event.retrieved.
    top_k: 3
    min_retrieval_score: 0.0   # Minimum retrieval score threshold.
    only_successful: False   # Whether retrieval only searches memories from successful trajectories.
    rebuild_insert_batch_size: 1000   # Batch size for inserting records during rebuild.
    rebuild_embedding_batch_size: 256   # Batch size for computing embeddings during rebuild.
    # Optional: submit a Slurm batch job on another node to run the FastAPI memory server (Apptainer + uvicorn).
    # Requires sbatch on the submit host; set enable=true, partition, and apptainer_sif for CentOS7 + Milvus Lite.
    remote_slurm_launch:
      enable: false
      # VDB 监听端口（推荐显式设置）。若未设置且 env.memory.server_port>0 则用后者；否则远程默认 8765。
      server_port: null
      partition: "" # Slurm -p (required when enable=true)
      account: null           # Slurm -A if needed
      exclude_nodes: ""       # Slurm --exclude (comma-separated hostnames)
      cpus_per_task: 4
      mem: "64G"
      gres: null              # e.g. "gpu:0" if your site requires a GRES line
      apptainer_sif: ""       # e.g. /path/to/glibc_ubuntu22.sif; empty = no container (node must have new glibc)
      apptainer_binds: "/mnt:/mnt"
      apptainer_nv: true
      conda_sh: ""            # default: ~/miniconda3/etc/profile.d/conda.sh
      conda_env: ""           # default: $CONDA_DEFAULT_ENV or verl-agent
      repo_root: ""           # default: $MEMADAPTOR_REPO_ROOT or auto from package path
      startup_timeout: 180    # seconds to wait for /health on the DB node
      scancel_on_close: true  # cancel Slurm job when training driver exits (atexit)
      sbatch_extra_lines: []  # extra #SBATCH lines (strings), e.g. module loads
    retrieval_instruction_prompt: "If you want to retrieve memory before acting, output exactly one query wrapped by {open_tag} and {close_tag}. After memory is returned, you will act in the next response."   # Prompt suffix used in agentic retrieval mode.
    retrieval_query_open_tag: "<memory_retrieve>"   # Open tag for agentic retrieval queries.
    retrieval_query_close_tag: "</memory_retrieve>"   # Close tag for agentic retrieval queries.
    max_query_chars: 1200   # Max query length used for retrieval.
    max_state_chars: 1200   # Max stored state text length.
    max_action_chars: 400   # Max stored action text length.
    max_memory_chars: 1200   # Max stored memory text length.
    prompt_header: "Relevant past memories are provided below. Reuse them only if you think which ones are useful."   # Header inserted before retrieved memories.
  resources_per_worker: # resources for each env worker
    num_cpus: 0.1
    num_gpus: 0
  rollout:
    n: 1 # the group number of envs (for GRPO and GiGPO).
  alfworld:
    eval_dataset: eval_in_distribution
    # If True, val_envs use AlfredTWEnv train split (train_eval=train). Use when data.val_files is train.parquet (full train eval under trainer.val_only).
    validate_on_train_split: false
  search:
    log_requests: false
    search_url: "http://127.0.0.1:8000/retrieve" # also support multiple urls: ["http://127.0.0.1:8000/retrieve", "http://127.0.0.1:8001/retrieve"]
    topk: 3
    timeout: 60
  sokoban:
    dim_room: [6, 6]
    num_boxes: 1
    search_depth: 30
    mode: tiny_rgb_array
  webshop:
    use_small: True
    human_goals: False

# Memory Adaptor (inference hook): batched generate via WorkerGroup; see agent_system/memory/mem_adaptor_rollout.py
# Recommended with env.memory.retrieval_mode=agentic so infos carry memory_event (retrieved list).
# Dedicated WG: set enable=true, use_actor_rollout_wg=false, model.path, and extra GPUs via resource_pool_gpus_per_node.
mem_adaptor:
  enable: false
  schedule: on_memory_only   # on_memory_only | every_step
  use_actor_rollout_wg: false   # false -> second Role on mem_adaptor_pool (see verl/trainer/main_ppo.py)
  retrieval_top_k: 1   # take top-k retrieved (S_old,P_old) hits; one batched generate; merges non-EMPTY outputs
  multi_hit_joiner: "\n\n"   # between accepted adapted principles when retrieval_top_k > 1
  # Optimize Memory Adaptor with GRPO (episode return on adaptor completions). Requires mem_adaptor.enable=true,
  # use_actor_rollout_wg=false, dedicated model.path, local adaptor rollout (hf/vllm), and algorithm.adv_estimator=grpo.
  # Reasoning: actor_rollout_ref.actor.trainable false (frozen) or true (joint).
  train_memory_adaptor: false
  # After GRPO advantage on Adaptor rows: divide each row's adv by (# Adaptor calls on that traj).
  grpo_divide_advantage_by_traj_adaptor_steps: true
  model:
    path: null   # HF checkpoint for adaptor when use_actor_rollout_wg=false (required then)
    use_shm: false
  # When the main policy uses rollout.name=openai_api, the adaptor WorkerGroup still needs hf or vllm (default vllm).
  local_rollout_name: vllm
  # Per-node GPU counts for mem_adaptor_pool (length must match trainer.nnodes). Default [1,...,1]. Sum with global pool must fit cluster.
  resource_pool_gpus_per_node: null
  # Fine-grained adaptor schedule (optional). Global step = trainer global_step during rollout; env step = post-step episode length for that env.
  train_global_step_start: null   # inclusive; null = no lower bound
  train_global_step_end: null     # exclusive upper bound; null = unbounded
  # Env-step window for running the adaptor (reduces training rows when memory only matters mid/late episode).
  # Index = episode_lengths[i] AFTER the env step (1-based). Inclusive start, exclusive end.
  # Example: max_steps=30 → env_step_end=31 runs adaptor on env steps 1..30; every_n=2 → steps 1,3,5,...
  env_step_start: null            # inclusive 1-based env step; null defaults to 1
  env_step_end: null              # exclusive; null = unbounded
  env_step_every_n: 1             # run adaptor only when (env_step - env_step_start) % n == 0
  # Optional: per global-step window, override the three keys above (same semantics). First match wins.
  # Example: early training call adaptor on every env step; later only every 2nd step from 5 onward:
  # env_step_phases:
  #   - global_step_start: 0
  #     global_step_end: 300
  #     env_step_start: 1
  #     env_step_end: 31
  #     env_step_every_n: 1
  #   - global_step_start: 300
  #     global_step_end: null
  #     env_step_start: 5
  #     env_step_end: 31
  #     env_step_every_n: 2
  env_step_phases: null
  system_prompt: >-
    You adapt a retrieved memory principle to the CURRENT situation, or output exactly <EMPTY> if the principle does not apply.
  user_message_template: |-
    Current situation (state):
    {s_curr}

    Retrieved historical state:
    {s_old}

    Historical principle (memory):
    {p_old}

    Output ONLY the adapted principle text, or exactly <EMPTY>.
  empty_output_markers:
    - "<EMPTY>"
    - "<empty>"
  # On adaptor <EMPTY>, the <memory>...</memory> block is removed, then this string is appended to the observation text.
  no_experience_message: "(No validated memory principle applies; rely on observation and reasoning.)"
  # One adaptor forward per retrieved hit; non-<EMPTY> outputs are merged with multi_hit_joiner. {index} is 1-based among accepted outputs only.
  adapted_principle_label_template: "Adapted memory principle {index}:\n"
  # Legacy: used only if adapted_principle_label_template is null or whitespace.
  adapted_injection_prefix: "Adapted memory principle:\n"
  placeholder_old_state: "(none)"
  placeholder_old_principle: "(none)"
  # Non-null: overrides data.apply_chat_template_kwargs for adaptor apply_chat_template only.
  # Use the adaptor tokenizer (mem_adaptor.model.path); kwargs should match that checkpoint's chat format.
  apply_chat_template_kwargs: null
  # GRPO auxiliary: subtract penalty from outcome reward on the scored token when decoded response matches pattern.
  # Default pattern: CJK, kana, Hangul, Cyrillic, Arabic. Set pattern: null uses default; or a custom regex string.
  grpo_english_shaping:
    enable: true
    penalty: 0.5
    pattern: null
  max_new_tokens: 256
  max_prompt_chars: 12000
  do_sample: true
  temperature: 1
  top_p: 1.0
