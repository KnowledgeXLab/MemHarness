trainer:
  nnodes: 1
  n_gpus_per_node: 8

data:
  path: null
  max_prompt_length: 1024
  max_response_length: 15360
  prompt_key: item_id
  n_samples: 1
  output_path: null
  batch_size: 16

agentgym:
    task_name: textcraft
    env_addr: 'http://localhost:5000'
    max_retries: 10
    max_rounds: 10
    timeout: 300

model:
  path: null
  external_lib: null
rollout:
    name: vllm
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_model_len: 32768
    max_num_seqs: 1024
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: ${actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor.ppo_max_token_len_per_gpu}
    max_tokens: 1024
    disable_log_stats: True
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    send_interval: 1
    rollout_log_dir: null
    memory:
      enabled: False
      backend: milvus
      mode: init_if_missing   # choices: init_if_missing | recreate
                              # init_if_missing: create collection when missing; use existing if present
                              # recreate: drop and rebuild collection from source (bootstrap_path or rebuild manually)
      store_dir: null
      write_back: True
      only_successful: True
      only_store_positive_reward: True
      vdb_base_url: null
      vdb_timeout: 30
      milvus_db_path: null
      collection_name: null   # if null, auto-generates as "agent_memories_{task_name}_{timestamp}"
      clean_before_init: False   # if True, remove existing db files in store_dir before initialization
      embedding_api_url: null
      embedding_api_key: "empty"
      embedding_model: bge_m3
      embedding_dim: 1024
      retrieval_mode: fixed  # choices: fixed | agentic, fixed means each turn use memory, agentic means agentic memory retrieval
      retrieve_key: "memory_text"   # choices: memory_text | state_text 
      retrieval_instruction_prompt: "If you want to retrieve memory before acting, output exactly one query wrapped by {open_tag} and {close_tag}. After memory is returned, you will act in the next response."
      retrieval_query_open_tag: "<memory_retrieve>"
      retrieval_query_close_tag: "</memory_retrieve>"
      rebuild_insert_batch_size: 1000
      rebuild_embedding_batch_size: 256
      top_k: 3
      min_retrieval_score: 0
      max_pairs_per_episode: 8
      max_query_chars: 1200
      max_state_chars: 1200
      max_action_chars: 400
      max_memory_chars: 1200
      prompt_header: "Relevant past experiences are provided below. Reuse them only if they are consistent with the current state."

actor:
  strategy: fsdp  # This is for backward-compatibility
  ppo_mini_batch_size: 16
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: 1
  use_dynamic_bsz: False
  ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
  grad_clip: 1.0
  clip_ratio: 0.2
  entropy_coeff: 0.001
  use_kl_loss: null # True for GRPO
  kl_loss_coef: 0.001 # for grpo
  kl_loss_type: low_var_kl # for grpo
  ppo_epochs: 1
  shuffle: False
  ulysses_sequence_parallel_size: 1 # sp size
  optim:
    lr: 1e-6
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  fsdp_config:
    wrap_policy:
      # transformer_layer_cls_to_wrap: None
      min_num_params: 0
    param_offload: False
    grad_offload: False
    optimizer_offload: False
    fsdp_size: -1